title: ¿Tienes *preguntas?*
buttonText: Contáctanos
buttonHref: "/contacto"
items:
  - question: ¿Qué tipo de agencia es Valhu Group?
    answer: >-
      Somos una agencia de innovación. Trabajamos diseño y desarrollo web, performance ads en Google
      y Meta, diseño UX/UI y branding, cuatro frentes que casi siempre van juntos. Al estar todo en
      un mismo equipo, la marca, la web y las campañas hablan el mismo idioma.
    active: true
  - question: ¿Puedo contratar un solo servicio o tienen que ser todos?
    answer: >-
      Puedes contratar solo uno. Hay proyectos que necesitan únicamente rediseñar la web, ordenar la
      marca o levantar campañas, y los tomamos así. Dicho eso, cuando un negocio parte de cero,
      resolver los cuatro frentes con un mismo equipo suele salir mejor que repartirlos entre
      proveedores distintos.
    active: true
  - question: ¿Cómo empieza el trabajo?
    answer: >-
      Nos escribes por el formulario y te respondemos dentro de las siguientes **48 horas** para
      agendar una reunión. Ahí entendemos bien qué necesitas, y recién después te enviamos una
      cotización hecha a tu medida. No cotizamos a ciegas.
    active: true
  - question: ¿Trabajan con marcas que recién empiezan?
    answer: >-
      Sí. Buena parte de lo que hacemos es acompañar a negocios y startups a construir su presencia
      digital desde cero, definiendo la marca, lanzando la primera web y empezando a traer clientes.
      También trabajamos con empresas que ya están andando y necesitan renovar lo que tienen.
    active: true
  - question: ¿Trabajan con clientes fuera de Perú?
    answer: >-
      Sí, trabajamos de forma remota. Las reuniones son por videollamada y la coordinación del día a
      día va por correo o mensajería, con la misma dinámica que usamos con los clientes locales.
    active: true
